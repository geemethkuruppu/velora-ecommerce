services:
  db:
    image: postgres:15-alpine
    container_name: velora-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=auth_db,product_db,inventory_db,order_db,cart_db
    ports:
      - "5433:5432" # Host 5433 to avoid conflict with local postgres if running
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - velora-network

  auth-service:
    build: ./auth-service
    ports:
      - "8000:8000"
    env_file: ./auth-service/.env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=auth_db
      - DB_SSLMODE=disable
    depends_on:
      - db
    networks:
      - velora-network

  product-service:
    build: ./product-service
    ports:
      - "8001:8001"
    env_file: ./product-service/.env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=product_db
      - DB_SSLMODE=disable
      - INVENTORY_SERVICE_URL=http://inventory-service:8004/api/v1
    depends_on:
      - db
    networks:
      - velora-network

  inventory-service:
    build: ./inventory-service
    ports:
      - "8004:8004"
    env_file: ./inventory-service/.env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=inventory_db
      - DB_SSLMODE=disable
      - ORDER_SERVICE_URL=http://order-service:8002/api/v1
      - PRODUCT_SERVICE_URL=http://product-service:8001/api/v1
    depends_on:
      - db
    networks:
      - velora-network

  order-service:
    build: ./order-service
    ports:
      - "8002:8002"
    env_file: ./order-service/.env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=order_db
      - DB_SSLMODE=disable
      - INVENTORY_SERVICE_URL=http://inventory-service:8004/api/v1
      - PRODUCT_SERVICE_URL=http://product-service:8001/api/v1
    depends_on:
      - db
    networks:
      - velora-network

  cart-service:
    build: ./cart-service
    ports:
      - "8005:8005"
    env_file: ./cart-service/.env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cart_db
      - DB_SSLMODE=disable
      - PRODUCT_SERVICE_URL=http://product-service:8001/api/v1
    depends_on:
      - db
    networks:
      - velora-network

networks:
  velora-network:
    driver: bridge

volumes:
  postgres_data:
