name: Deploy Dashboard Frontend

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: velora-admin-dashboard
  CLOUDFRONT_DISTA_ID: E19BQ97MHMGXAW

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json

    - name: Install Dependencies
      run: |
        cd dashboard
        npm ci

    - name: Build Project
      run: |
        cd dashboard
        npm run build
      env:
        # POINT THIS TO YOUR API GATEWAY URL
        VITE_AUTH_URL: https://yto1thkib4.execute-api.ap-south-1.amazonaws.com/prod/api/v1/auth
        VITE_PRODUCT_URL: https://yto1thkib4.execute-api.ap-south-1.amazonaws.com/prod/api/v1/products
        VITE_ORDER_URL: https://yto1thkib4.execute-api.ap-south-1.amazonaws.com/prod/api/v1/orders
        VITE_INVENTORY_URL: https://yto1thkib4.execute-api.ap-south-1.amazonaws.com/prod/api/v1/inventory
        VITE_CART_URL: https://yto1thkib4.execute-api.ap-south-1.amazonaws.com/prod/api/v1/cart

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Sync to S3
      run: |
        aws s3 sync dashboard/dist s3://${{ env.S3_BUCKET }} --delete

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTA_ID }} --paths "/*"
