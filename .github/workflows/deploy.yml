name: Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_AUTH: velora-auth
  ECR_REPOSITORY_PRODUCT: velora-product
  ECR_REPOSITORY_ORDER: velora-order
  ECR_REPOSITORY_INVENTORY: velora-inventory
  ECR_REPOSITORY_CART: velora-cart

jobs:
  deploy:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push Auth Service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AUTH:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_AUTH:latest ./backend/auth-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AUTH:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AUTH:latest

    - name: Build, tag, and push Product Service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_PRODUCT:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_PRODUCT:latest ./backend/product-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PRODUCT:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_PRODUCT:latest

    - name: Build, tag, and push Order Service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_ORDER:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_ORDER:latest ./backend/order-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_ORDER:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_ORDER:latest

    - name: Build, tag, and push Inventory Service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_INVENTORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_INVENTORY:latest ./backend/inventory-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_INVENTORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_INVENTORY:latest

    - name: Build, tag, and push Cart Service
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_CART:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY_CART:latest ./backend/cart-service
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_CART:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_CART:latest
